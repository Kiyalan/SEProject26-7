server:
  port: 8000

spring:
  application:
    name: repopilot-backend
  datasource:
    url: jdbc:h2:file:./data/knowledge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      keepalive-time: 120000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

repopilot:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:5173/auth/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:repopilot-jwt-secret-change-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    model: ${LLM_MODEL:openai/gpt-oss-20b:free}
    embedding-model: ${LLM_EMBEDDING_MODEL:openai/text-embedding-3-small}
    http-referer: ${LLM_HTTP_REFERER:http://localhost:5173}
    app-title: ${LLM_APP_TITLE:RepoPilot}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:RepoPilot <noreply@repopilot.dev>}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  codewiki:
    base-url: ${CODEWIKI_BASE_URL:http://127.0.0.1:8001}
    host-repo-root: ${CODEWIKI_HOST_REPO_ROOT:./data/repos}
    container-repo-root: ${CODEWIKI_CONTAINER_REPO_ROOT:/workspace/repositories/SEProject26-7/backend/data/repos}
    # Standard GraphRAG Local Search requires entity embeddings in CodeWiki/pgvector.
    include-embeddings: ${CODEWIKI_INCLUDE_EMBEDDINGS:true}
    connect-timeout-seconds: ${CODEWIKI_CONNECT_TIMEOUT_SECONDS:15}
    # GraphRAG / wiki can take long; keep HTTP read timeout aligned with run timeout
    read-timeout-seconds: ${CODEWIKI_READ_TIMEOUT_SECONDS:7200}
    run-poll-seconds: ${CODEWIKI_RUN_POLL_SECONDS:5}
    # Large repos often need >1h (AST parse + persist). Default 2h.
    run-timeout-seconds: ${CODEWIKI_RUN_TIMEOUT_SECONDS:7200}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:repopilot2026}
